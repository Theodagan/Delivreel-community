services:
  api:
    build:
      context: ./apps/backend
      dockerfile: ../../devops/dev/dev.backend.Dockerfile
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      APP_ENV: dev
      NODE_ENV: development
      VIDEO_PROVIDER: ${VIDEO_PROVIDER:-auto}
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
      - ./resources/public/uploads:/app/uploads
      - ./resources/public/hls:/app/hls
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_BIND_PORT:-3000}"
    networks:
      - delivreel-network
    restart: unless-stopped
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - delivreel-network
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: ../../devops/dev/dev.frontend.Dockerfile
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-4200}:${FRONTEND_PORT:-4200}"
    depends_on:
      - api
    networks:
      - delivreel-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    env_file:
      - ${ENV_FILE:-.env}
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./devops/dev/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command:
      - /bin/sh
      - -c
      - "envsubst '$$BACKEND_BIND_PORT $$FRONTEND_PORT' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    depends_on:
      - api
      - frontend
    networks:
      - delivreel-network
    restart: unless-stopped

  adminer:
    image: adminer
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres
    networks:
      - delivreel-network
    restart: unless-stopped

networks:
  delivreel-network:
    driver: bridge

volumes:
  postgres_data:
